name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    name: Relative link check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check relative Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments './**/*.md'"
          fail: true
  yaml:
    runs-on: ubuntu-latest
    name: YAML validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Validate YAML files
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True)):
              try: list(yaml.safe_load_all(open(f))); print("ok  ", f)
              except Exception as e: print("FAIL", f, e); bad += 1
          sys.exit(1 if bad else 0)
          PY
